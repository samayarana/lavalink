lavalink:
    plugins:
        - dependency: dev.lavalink.youtube:youtube-plugin:1.18.0
          repository: https://maven.lavalink.dev/releases
        - dependency: com.github.infnibor.lavasrc:lavasrc-plugin:08f7f9e
          repository: https://maven.pcreators.pl/snapshots
        - dependency: com.github.topi314.lavasearch:lavasearch-plugin:1.0.0
          repository: https://maven.lavalink.dev/releases
    server:
        bufferDurationMs: 400
        filters:
            channelMix: true
            distortion: true
            equalizer: true
            karaoke: true
            lowPass: true
            rotation: true
            timescale: true
            tremolo: true
            vibrato: true
            volume: true
        frameBufferDurationMs: 5000
        gcWarnings: true
        opusEncodingQuality: 5
        password: yourpass
        playerUpdateInterval: 5
        readTimeout: 60000
        requestTimeout: 60000
        resamplingQuality: HIGH
        soundcloudSearchEnabled: true
        sources:
            bandcamp: true
            http: true
            local: false
            nico: true
            soundcloud: true
            twitch: true
            vimeo: true
            youtube: false
        trackStuckThresholdMs: 10000
        useSeekGhosting: true
        youtubePlaylistLoadLimit: 6
        youtubeSearchEnabled: true
logging:
    file:
        path: ./logs/
    level:
        dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO
        lavalink: INFO
        root: INFO
    logback:
        rollingPolicy:
            maxFileSize: 1GB
            maxHistory: 30
    request:
        enabled: true
        includeClientInfo: true
        includeHeaders: false
        includePayload: true
        includeQueryString: true
        maxPayloadLength: 10000
metrics:
    prometheus:
        enabled: false
        endpoint: /metrics
plugins:
    lavasrc:
        providers:
            - ytsearch:"%ISRC%"
            - ytsearch:%QUERY%
            - "scsearch:%QUERY%"
        sources:
            applemusic: false
            deezer: false
            flowerytts: false
            spotify: true
            yandexmusic: false
            youtube: true
        spotify:
            albumLoadLimit: 6
            clientId: 68a79dab4bc54b6fad1a055182b58312
            clientSecret: 97726521301141719ed019047a934610
            countryCode: KH
            playlistLoadLimit: 6
            localFiles: false
            preferPartnerApi: true
            resolveArtistsInSearch: true
            customTokenEndpoint: "https://sptoken.unknownz.us.cc/api/token" 
    youtube:
        allowDirectPlaylistIds: true
        allowDirectVideoIds: true
        allowSearch: true
        clients:
            - MUSIC
            - WEB
            - TV
            - TVHTML5EMBEDDED
            - ANDROID_VR
        enabled: true
        oauth:
            enabled: true
            refreshToken: 1//0gVUatVCjceKlCgYIARAAGBASNwF-L9IrNYyaJidg0l8HPCaEAkEPmswfhjoJiExqa3OPVXQ-oPVZYHRY8oj2rv7SrFTi4cEmszs
            skipInitialization: true
        remoteCipher:
            url: https://cipher.kikkia.dev/
            userAgent: lavalink-server
sentry:
    dsn: ""
    environment: ""
server:
    address: 0.0.0.0
    http2:
        enabled: false
    port: 443
