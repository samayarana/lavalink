server: # REST and WS server
  port: 80
  address: 0.0.0.0
  http2:
    enabled: false 

lavalink:
  plugins:
    # --- CRITICAL UPDATE BELOW ---
    # We are forcing version 1.16.0. 
    # If this still fails, you MUST delete your 'plugins' folder and restart.
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.16.0"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.1"

  server:
    password: "test"
    sources:
      youtube: false # Native plugin handles this
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false
    filters: 
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true
    bufferDurationMs: 400 
    frameBufferDurationMs: 1000 
    opusEncodingQuality: 10 
    resamplingQuality: HIGH 
    trackStuckThresholdMs: 10000
    useSeekGhosting: true
    playerUpdateInterval: 1 
    youtubePlaylistLoadLimit: 6 
    gc-warnings: true

metrics:
  prometheus:
    enabled: false
    endpoint: /metrics

sentry:
  dsn: ""
  environment: ""

logging:
  file:
    path: ./logs/

  level:
    root: INFO
    lavalink: INFO

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true
    clients:
      - TV
      - TVHTML5EMBEDDED
      - WEB
      - WEBEMBEDDED
      - MUSIC
    # Remote Cipher allows you to bypass age restrictions and throttling
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
    oauth:
      enabled: true
      skipInitialization: false
      refreshToken: "1//01XDzH4WZOz4PCgYIARAAGAESNwF-L9IroYD6pJ13sfitnqFag3g7PASWJ-ipAYNXm7pk8hBXzNagQ51k5nITXQ3_IAZHbctqAOQ"
    
  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\"" 
      - "ytsearch:%QUERY%"
    sources:
      spotify: true      # ENABLED
      applemusic: false  # DISABLED
      deezer: false      # DISABLED
      yandexmusic: false # DISABLED
      flowerytts: false  # DISABLED
      youtube: false     # DISABLED
    spotify:
      clientId: "f71a3da30e254962965ca2a89d6f74b9"
      clientSecret: "199a619d22dd4e55a4a2c1a7a3d70e63"
      countryCode: "US"
      playlistLoadLimit: 6
      albumLoadLimit: 6
